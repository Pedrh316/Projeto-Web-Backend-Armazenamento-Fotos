<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar conta</title>
  <link rel="stylesheet" href="styles/style.css">
  <script src="scripts/auth.js" defer></script>
</head>
<body>
  <main class="card">
    <div class="eyebrow">NOVA CONTA</div>
    <h1>Crie sua conta</h1>
    <p class="subtitle">Use este formulário para testar o endpoint de registro.</p>

    <form id="registrarForm">
      <label for="nome">Nome</label>
      <input id="nome" name="nome" type="text" autocomplete="name" placeholder="Seu nome" required>
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="voce@exemplo.com" required>
      <label for="senha">Senha</label>
      <input id="password" name="password" type="password" autocomplete="password" placeholder="Crie uma senha" required>
      <button type="submit">Registrar</button>
    </form>

    <div id="mensagem" class="message" role="status" aria-live="polite"></div>
    <p class="footer">Já tem uma conta? <a href="login.html">Voltar ao login</a></p>
  </main>
</body>
</html>
