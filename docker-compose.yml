
services:
  database:
    image: mongo:latest
    container_name: ${MONGO_CONTAINER_NAME}
    restart: always
    ports:
      - "${MONGO_PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  backend:
    image: node:22-alpine
    container_name: node_web_backend_service
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_deps:/app/node_modules
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: sh -c "npm install && node src/app.js"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    container_name: frontend_site
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
  editor:
    image: codercom/code-server:latest
    ports:
      - "8080:8080"
    environment:
      PASSWORD: "123"
    volumes:
      - ./:/home/coder/project
    command: --bind-addr 0.0.0.0:8080 /home/coder/project

volumes:
  mongo_data:
    name: ${MONGO_VOLUME_NAME}
  backend_deps:
  frontend_deps:
